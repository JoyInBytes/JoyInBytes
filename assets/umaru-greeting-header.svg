<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hello, it's JoyInBytes — Your Data Engineer</title>
  <desc id="desc">Animated Umaru header with a friendly Data Engineer greeting.</desc>
  <defs>
    <clipPath id="line1"><rect x="82" y="102" width="0" height="48"><animate attributeName="width" values="0;0;500;500" keyTimes="0;.08;.32;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="82" y="153" width="0" height="40"><animate attributeName="width" values="0;0;420;420" keyTimes="0;.34;.55;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="82" y="201" width="0" height="38"><animate attributeName="width" values="0;0;390;390" keyTimes="0;.57;.78;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <image href="https://raw.githubusercontent.com/JoyInBytes/JoyInBytes/main/assets/umaru-header.gif?v=5" x="0" y="0" width="1200" height="300" preserveAspectRatio="xMidYMid meet"/>

  <rect x="64" y="86" width="600" height="168" rx="12" fill="#020617"/>
  <circle cx="77" cy="103" r="5" fill="#FFD700"/>

  <g clip-path="url(#line1)">
    <text x="82" y="139" fill="#FFD700" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="1">HELLO, IT'S JOYINBYTES</text>
  </g>

  <g clip-path="url(#line2)">
    <text x="82" y="187" fill="#35C9FF" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="4">YOUR DATA ENGINEER</text>
  </g>

  <g clip-path="url(#line3)">
    <text x="82" y="230" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="2">HOW CAN I HELP YOU?</text>
  </g>

  <rect x="82" y="208" width="3" height="27" fill="#FFD700" filter="url(#softGlow)">
    <animate attributeName="x" values="82;82;475;475" keyTimes="0;.57;.78;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1" dur=".7s" repeatCount="indefinite"/>
  </rect>
</svg>