<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Joy in Bytes — Data Engineer</title>
  <desc id="desc">A clean dark profile banner with Data Engineer as the main title, SQL, Python, and Databricks as focus areas, and Umaru animated while solving a Rubik’s Cube.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <clipPath id="mascot-window">
      <rect x="875" y="22" width="300" height="276" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#080D1B"/>
  <rect x="2" y="2" width="1196" height="316" rx="26" fill="none" stroke="#263654" stroke-width="2"/>
  <rect x="34" y="32" width="5" height="256" rx="2.5" fill="url(#accent)"/>

  <g aria-hidden="true">
    <rect x="66" y="58" width="12" height="12" rx="2" fill="#EF4444"/>
    <rect x="84" y="58" width="12" height="12" rx="2" fill="#FFD700"/>
    <rect x="102" y="58" width="12" height="12" rx="2" fill="#22C55E"/>
  </g>

  <text x="66" y="106" fill="#9AAAC4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">JOY IN BYTES</text>
  <text x="64" y="174" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1">DATA ENGINEER</text>
  <text x="66" y="218" fill="#38BDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1.4">SQL  ·  PYTHON  ·  DATABRICKS</text>
  <text x="66" y="252" fill="#A7B4C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Building reliable, analytics-ready data pipelines.</text>

  <g aria-hidden="true">
    <path d="M66 278 H742" stroke="#263654" stroke-width="2" stroke-linecap="round"/>
    <circle cx="66" cy="278" r="5" fill="#EF4444"/>
    <circle cx="404" cy="278" r="5" fill="#38BDF8"/>
    <circle cx="742" cy="278" r="5" fill="#22C55E"/>
    <text x="80" y="283" fill="#66758E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">INGEST</text>
    <text x="418" y="283" fill="#66758E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">TRANSFORM</text>
    <text x="756" y="283" fill="#66758E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DELIVER</text>
  </g>

  <path d="M846 45 V275" stroke="#34435D" stroke-width="2"/>
  <rect x="866" y="14" width="318" height="292" rx="24" fill="#11192B"/>
  <image href="umaru-header.gif" x="0" y="0" width="1200" height="320" preserveAspectRatio="none" clip-path="url(#mascot-window)"/>
  <rect x="866" y="14" width="318" height="292" rx="24" fill="none" stroke="#34435D" stroke-width="2"/>
</svg>
